name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: make build
      - name: Test
        run: go test -short ./internal/...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0

  cross-build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Cross-build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          go build -ldflags='-s -w' -o bin/omp-sync ./cmd/omp-sync
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omp-sync-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/omp-sync
